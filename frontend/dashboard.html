    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Check if user is authenticated before loading content
        const sessionCheck = sessionManager.checkSession();
        if (!sessionCheck.valid) {
          console.log("Session invalid:", sessionCheck.reason);
          sessionManager.redirectToLogin();
          return;
        }

        const tableBody = document.querySelector("#userTable tbody");
        const pageSizeSelect = document.getElementById("pageSize");
        const entryCount = document.getElementById("entryCount");
        const pagination = document.getElementById("pagination");

        let users = [];
        let currentPage = 1;
        let pageSize = parseInt(pageSizeSelect.value);

        // ✅ Format date to dd/mm/yyyy
        function formatDate(dateString) {
          if (!dateString) return "N/A";

          try {
            const date = new Date(dateString);

            // Check if date is valid
            if (isNaN(date.getTime())) return "N/A";

            const day = String(date.getDate()).padStart(2, "0");
            const month = String(date.getMonth() + 1).padStart(2, "0"); // Months are 0-based
            const year = date.getFullYear();

            return `${day}/${month}/${year}`;
          } catch (error) {
            console.error("Error formatting date:", error);
            return "N/A";
          }
        }

        // Update countdown timers
        let countdownInterval = null;
        
        function updateCountdowns() {
          // Clear existing interval
          if (countdownInterval) {
            clearInterval(countdownInterval);
          }
          
          // Update every second
          countdownInterval = setInterval(() => {
            const countdownElements = document.querySelectorAll('.countdown');
            const now = new Date().getTime();
            let hasActiveCountdowns = false;
            
            countdownElements.forEach(element => {
              const resetTime = parseInt(element.dataset.reset);
              const timeRemaining = resetTime - now;
              
              if (timeRemaining <= 0) {
                // Time's up - show ready status
                element.className = 'badge bg-success';
                element.innerHTML = '<i class="fas fa-check"></i> Ready';
              } else {
                hasActiveCountdowns = true;
                const hours = Math.floor(timeRemaining / (1000 * 60 * 60));
                const minutes = Math.floor((timeRemaining % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeRemaining % (1000 * 60)) / 1000);
                
                element.textContent = `${hours}h ${minutes}m ${seconds}s`;
              }
            });
            
            // If no active countdowns, clear interval
            if (!hasActiveCountdowns && countdownElements.length > 0) {
              clearInterval(countdownInterval);
              countdownInterval = null;
            }
          }, 1000);
        }

        // ✅ API URL Configuration - Auto-detect environment
        const API_URL = (() => {
          const hostname = window.location.hostname;
          const port = window.location.port;
          
          // If we're on localhost/127.0.0.1
          if (hostname === 'localhost' || hostname === '127.0.0.1') {
            // If already on port 5001, use relative URLs (served by backend)
            if (port === '5001') {
              return '';
            }
            // Otherwise (different port or file://), use full URL
            return 'http://localhost:5001';
          }
          
          // Production (Vercel) - use relative URLs
          return '';
        })();
        
        async function fetchUsers() {
          // Show loader row
          const loader = document.getElementById("usersLoader");
          if (loader) loader.style.display = "table-row";
          
          try {
            // Check session validity
            const sessionCheck = sessionManager.checkSession();
            if (!sessionCheck.valid) {
              sessionManager.logout();
              return;
            }

            const res = await fetch(`${API_URL}/api/users`, {
              headers: {
                "Content-Type": "application/json",
                "X-Session-ID": sessionCheck.sessionData?.sessionId || "",
              },
            });

            // Handle session expired responses from server
            if (res.status === 401 || res.status === 403) {
              Swal.fire({
                icon: "warning",
                title: "Session Expired",
                text: "Your session has expired. Please login again.",
                confirmButtonText: "OK",
              }).then(() => {
                sessionManager.logout();
              });
              return;
            }

            if (!res.ok) {
              throw new Error(`HTTP error! status: ${res.status}`);
            }

            users = await res.json();

            // Sort users: oldest first (latest last)
            users.sort((a, b) => {
              const dateA = new Date(a.joinedOn || a.createdAt || 0);
              const dateB = new Date(b.joinedOn || b.createdAt || 0);
              return dateA - dateB; // Ascending order (oldest first)
            });

            renderTable();
            renderPagination();
            updateEntryCount();
          } catch (err) {
            console.error("Error fetching users:", err);
            console.error("Error name:", err.name);
            console.error("Error message:", err.message);
            console.error("API_URL:", API_URL);
            console.error("Full URL:", `${API_URL}/api/users`);
            
            // Hide loader on error
            const loader = document.getElementById("usersLoader");
            if (loader) loader.style.display = "none";

            // Show detailed error message
            let errorMessage = "Failed to load users. ";
            if (err.message.includes("Failed to fetch") || err.name === "TypeError") {
              errorMessage = "Unable to connect to server. Please check your connection and try again.";
            } else if (err.message.includes("HTTP error")) {
              errorMessage = `Server error: ${err.message}`;
            } else {
              errorMessage = err.message || "Unknown error occurred";
            }

            Swal.fire({
              icon: "error",
              title: "Connection Error",
              text: errorMessage,
              confirmButtonText: "OK",
            });

            tableBody.innerHTML =
              '<tr><td colspan="10" class="text-danger text-center">Failed to load users. Check console for details.</td></tr>';
          } finally {
            // Hide loader row
            const loader = document.getElementById("usersLoader");
            if (loader) loader.style.display = "none";
          }
        }

        function renderTable() {
          // Update last activity when rendering table
          sessionManager.updateLastActivity();

          tableBody.innerHTML = "";
          if (users.length === 0) {
            tableBody.innerHTML =
              '<tr><td colspan="10" class="text-center text-muted">No records found</td></tr>';
            return;
          }

          const start = (currentPage - 1) * pageSize;
          const paginatedUsers = users.slice(start, start + pageSize);
          const now = new Date();

          paginatedUsers.forEach((user, index) => {
            // Format date/time
            const dateObj = user.joinedOn ? new Date(user.joinedOn) : (user.createdAt ? new Date(user.createdAt) : new Date());
            const dateStr = formatDate(dateObj);
            const timeStr = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            const dateTimeDisplay = `${dateStr}<br><small class="text-muted">${timeStr}</small>`;

            // Score display
            const scoreDisplay = user.score !== null && user.score !== undefined 
              ? `<span class="badge bg-info">${user.score}/${user.total || 'N/A'}</span>`
              : '<span class="text-muted">-</span>';

            // Attempt Number display
            const attemptNumberDisplay = user.attemptNumber 
              ? `<span class="badge bg-secondary">#${user.attemptNumber}</span>`
              : '<span class="text-muted">-</span>';

            // Calculate attempt status
            const dailyAttempts = user.dailyAttempts || 0;
            const lastAttemptDate = user.lastAttemptDate ? new Date(user.lastAttemptDate) : null;
            
            let attemptsDisplay = `${dailyAttempts}/3`;
            let statusDisplay = '';
            
            if (lastAttemptDate) {
              const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
              const lastAttemptDay = new Date(
                lastAttemptDate.getFullYear(),
                lastAttemptDate.getMonth(),
                lastAttemptDate.getDate()
              );
              
              if (lastAttemptDay.getTime() === today.getTime()) {
                // Same day
                if (dailyAttempts >= 3) {
                  // Limit reached - show countdown
                  const tomorrow = new Date(today);
                  tomorrow.setDate(tomorrow.getDate() + 1);
                  const timeRemaining = tomorrow.getTime() - now.getTime();
                  
                  const hours = Math.floor(timeRemaining / (1000 * 60 * 60));
                  const minutes = Math.floor((timeRemaining % (1000 * 60 * 60)) / (1000 * 60));
                  const seconds = Math.floor((timeRemaining % (1000 * 60)) / 1000);
                  
                  statusDisplay = `<span class="badge bg-danger countdown" data-reset="${tomorrow.getTime()}">${hours}h ${minutes}m ${seconds}s</span>`;
                } else {
                  statusDisplay = '<span class="badge bg-success">Available</span>';
                }
              } else {
                // Different day - reset available
                attemptsDisplay = '0/3';
                statusDisplay = '<span class="badge bg-success"><i class="fas fa-check"></i> Ready</span>';
              }
            } else {
              // No attempts yet
              statusDisplay = '<span class="badge bg-success"><i class="fas fa-check"></i> Ready</span>';
            }

            tableBody.innerHTML += `
              <tr>
                <td>
                  <input 
                    type="checkbox" 
                    class="form-check-input user-checkbox" 
                    style="cursor: pointer;"
                    data-user-id="${user._id}"
                    onchange="updateBulkDeleteButton()">
                </td>
                <th scope="row">${start + index + 1}</th>
                <td>${user.name || "N/A"}</td>
                <td>${user.email || "N/A"}</td>
                <td>${scoreDisplay}</td>
                <td>${attemptNumberDisplay}</td>
                <td>${dateTimeDisplay}</td>
                <td><span class="badge bg-primary">${attemptsDisplay}</span></td>
                <td>${statusDisplay}</td>
                <td>
                  <button class="btn btn-sm btn-danger" onclick="deleteUser('${
                    user._id
                  }')">Delete</button>
                </td>
              </tr>
            `;
          });
          
          // Start countdown updates
          updateCountdowns();
          
          // Reset select all checkbox
          document.getElementById('selectAll').checked = false;
          updateBulkDeleteButton();
        }

        function renderPagination() {
          pagination.innerHTML = "";
          const pageCount = Math.ceil(users.length / pageSize) || 1;

          // Previous button
          const prevLi = document.createElement("li");
          prevLi.className = `page-item ${currentPage === 1 ? "disabled" : ""}`;
          prevLi.innerHTML = `<a class="page-link" href="#" aria-label="Previous">&laquo;</a>`;
          if (currentPage > 1) {
            prevLi.addEventListener("click", (e) => {
              e.preventDefault();
              sessionManager.updateLastActivity();
              currentPage--;
              renderTable();
              renderPagination();
              updateEntryCount();
            });
          }
          pagination.appendChild(prevLi);

          // Page numbers
          for (let i = 1; i <= pageCount; i++) {
            const li = document.createElement("li");
            li.className = `page-item ${i === currentPage ? "active" : ""}`;
            li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
            li.addEventListener("click", (e) => {
              e.preventDefault();
              sessionManager.updateLastActivity();
              currentPage = i;
              renderTable();
              renderPagination();
              updateEntryCount();
            });
            pagination.appendChild(li);
          }

          // Next button
          const nextLi = document.createElement("li");
          nextLi.className = `page-item ${
            currentPage === pageCount ? "disabled" : ""
          }`;
          nextLi.innerHTML = `<a class="page-link" href="#" aria-label="Next">&raquo;</a>`;
          if (currentPage < pageCount) {
            nextLi.addEventListener("click", (e) => {
              e.preventDefault();
              sessionManager.updateLastActivity();
              currentPage++;
              renderTable();
              renderPagination();
              updateEntryCount();
            });
          }
          pagination.appendChild(nextLi);
        }

        function updateEntryCount() {
          if (users.length === 0) {
            entryCount.textContent = "Showing 0 entries";
            return;
          }

          const start = (currentPage - 1) * pageSize + 1;
          const end = Math.min(currentPage * pageSize, users.length);
          entryCount.textContent = `Showing ${start} to ${end} of ${users.length} entries`;
        }

        pageSizeSelect.addEventListener("change", () => {
          sessionManager.updateLastActivity();
          pageSize = parseInt(pageSizeSelect.value);
          currentPage = 1;
          renderTable();
          renderPagination();
          updateEntryCount();
        });

        window.deleteUser = async function (id) {
          // Check session before deletion
          const sessionCheck = sessionManager.checkSession();
          if (!sessionCheck.valid) {
            sessionManager.redirectToLogin();
            return;
          }

          const result = await Swal.fire({
            title: "Are you sure?",
            text: "This user will be permanently deleted!",
            icon: "warning",
            showCancelButton: true,
            confirmButtonText: "Yes, delete it!",
            cancelButtonText: "Cancel",
          });

          if (result.isConfirmed) {
            try {
              sessionManager.updateLastActivity();

              const res = await fetch(`${API_URL}/api/users/${id}`, {
                method: "DELETE",
                headers: {
                  "Content-Type": "application/json",
                  // Add session ID to headers if needed for backend validation
                  "X-Session-ID": sessionCheck.sessionData?.sessionId || "",
                },
              });

              // Handle session expired responses from server
              if (res.status === 401 || res.status === 403) {
                Swal.fire({
                  icon: "warning",
                  title: "Session Expired",
                  text: "Your session has expired. Please login again.",
                  confirmButtonText: "OK",
                }).then(() => {
                  sessionManager.logout();
                });
                return;
              }

              const data = await res.json();

              if (res.ok) {
                users = users.filter((u) => u._id !== id);

                // Adjust pagination if current page becomes empty
                const pageCount = Math.ceil(users.length / pageSize);
                if (currentPage > pageCount && pageCount > 0) {
                  currentPage = pageCount;
                }

                renderTable();
                renderPagination();
                updateEntryCount();
                
                Swal.fire(
                  "Deleted!",
                  data.message || "User deleted successfully.",
                  "success"
                );
              } else {
                Swal.fire(
                  "Error",
                  data.message || "Failed to delete user.",
                  "error"
                );
              }
            } catch (err) {
              console.error("Delete failed", err);
              Swal.fire(
                "Error",
                "Server error occurred while deleting user.",
                "error"
              );
            }
          }
        };

        // Toggle select all checkboxes
        window.toggleSelectAll = function(checkbox) {
          const checkboxes = document.querySelectorAll('.user-checkbox');
          checkboxes.forEach(cb => {
            cb.checked = checkbox.checked;
          });
          updateBulkDeleteButton();
        };

        // Update bulk delete button state and count
        window.updateBulkDeleteButton = function() {
          const checkboxes = document.querySelectorAll('.user-checkbox:checked');
          const bulkDeleteBtn = document.getElementById('bulkDeleteBtn');
          const selectedCount = document.getElementById('selectedCount');
          const selectAllCheckbox = document.getElementById('selectAll');
          
          if (checkboxes.length > 0) {
            bulkDeleteBtn.disabled = false;
            selectedCount.textContent = checkboxes.length;
          } else {
            bulkDeleteBtn.disabled = true;
            selectedCount.textContent = '0';
            selectAllCheckbox.checked = false;
          }
        };

        // Delete selected users
        window.deleteSelectedUsers = async function() {
          const checkboxes = document.querySelectorAll('.user-checkbox:checked');
          
          if (checkboxes.length === 0) {
            return;
          }

          const userIds = Array.from(checkboxes).map(cb => cb.dataset.userId);
          
          const result = await Swal.fire({
            title: "Are you sure?",
            html: `You are about to delete <strong>${userIds.length}</strong> user(s). This action cannot be undone!`,
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#d33",
            cancelButtonColor: "#3085d6",
            confirmButtonText: "Yes, delete them!",
            cancelButtonText: "Cancel",
          });

          if (result.isConfirmed) {
            try {
              sessionManager.updateLastActivity();
              
              let successCount = 0;
              let errorCount = 0;
              
              // Delete users one by one
              for (const userId of userIds) {
                try {
                  const res = await fetch(`${API_URL}/api/users/${userId}`, {
                    method: "DELETE",
                    headers: {
                      "Content-Type": "application/json",
                    },
                  });

                  if (res.status === 401 || res.status === 403) {
                    Swal.fire({
                      icon: "warning",
                      title: "Session Expired",
                      text: "Your session has expired. Please login again.",
                      confirmButtonText: "OK",
                    }).then(() => {
                      sessionManager.logout();
                    });
                    return;
                  }

                  if (res.ok) {
                    successCount++;
                    users = users.filter((u) => u._id !== userId);
                  } else {
                    errorCount++;
                  }
                } catch (err) {
                  console.error("Delete failed for user:", userId, err);
                  errorCount++;
                }
              }

              // Show result
              if (successCount > 0) {
                // Adjust pagination if current page becomes empty
                const pageCount = Math.ceil(users.length / pageSize);
                if (currentPage > pageCount && pageCount > 0) {
                  currentPage = pageCount;
                }

                renderTable();
                renderPagination();
                updateEntryCount();
                
                Swal.fire(
                  "Deleted!",
                  `Successfully deleted ${successCount} user(s).${errorCount > 0 ? ` Failed to delete ${errorCount} user(s).` : ''}`,
                  successCount === userIds.length ? "success" : "warning"
                );
              } else {
                Swal.fire(
                  "Error",
                  "Failed to delete selected users.",
                  "error"
                );
              }
            } catch (err) {
              console.error("Bulk delete failed", err);
              Swal.fire(
                "Error",
                "Server error occurred while deleting users.",
                "error"
              );
            }
          }
        };

        // Display user info from session
        const userInfo = sessionManager.getUserInfo();
        // Initial data fetch
        fetchUsers();
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
          if (countdownInterval) {
            clearInterval(countdownInterval);
          }
        });
      });

      // Logout functionality
      document.addEventListener("DOMContentLoaded", function () {
        const logoutBtn = document.getElementById("logout");

        if (logoutBtn) {
          logoutBtn.addEventListener("click", function (e) {
            e.preventDefault();
            handleLogout();
          });
        }
      });

      function handleLogout() {
        Swal.fire({
          title: "Confirm Logout",
          text: "Are you sure you want to logout?",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#d33",
          cancelButtonColor: "#3085d6",
          confirmButtonText: "Yes, logout",
          cancelButtonText: "Cancel",
        }).then((result) => {
          if (result.isConfirmed) {
            // Show loading state
            Swal.fire({
              title: "Logging out...",
              text: "Please wait",
              allowOutsideClick: false,
              allowEscapeKey: false,
              showConfirmButton: false,
              didOpen: () => {
                Swal.showLoading();
              },
            });

            // Clear session and redirect after short delay
            setTimeout(() => {
              sessionManager.logout();
            }, 1000);
          }
        });
      }
    </script>
  </body>
</html>
